name: nebah
description: Nebah — AI-Powered Community Safety Platform for Nigeria and Africa.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  google_fonts: ^6.1.0
  http: ^1.6.0
  intl: ^0.19.0
  google_maps_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  image_picker: ^1.0.7
  google_polyline_algorithm: ^3.1.0
  flutter_polyline_points: ^2.0.1

  # SOS & Emergency features
  flutter_background_service: ^5.0.0
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1

  # UI & Utilities
  flutter_markdown: ^0.6.18
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.5.0
  battery_plus: ^6.0.2
  volume_controller: ^2.0.7
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

